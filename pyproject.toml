[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dscrypt"
version = "0.3.0"
description = "Offline file encryption using the standard age format through pyrage"
requires-python = ">=3.10"
dependencies = ["pyrage==1.4.0"]

[project.scripts]
dscrypt = "dscrypt:main"

[tool.setuptools]
py-modules = ["dscrypt"]
